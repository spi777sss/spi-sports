<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>SPI Sports</title>
<meta name="description" content="Resultados en directo, estadísticas, cuotas y pronósticos de fútbol y NBA.">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e14">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="color-scheme" content="dark light">
<meta name="spi-build" content="2026-10-25.5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPI Sports">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://site.api.espn.com">
<link rel="preconnect" href="https://a.espncdn.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* SPI Sports — stadium-scoreboard identity: condensed display numerals, ink surfaces, one cobalt signal.
   Layout: desktop = competitions rail | feed | match sheet. Tablet = feed + side sheet. Phone = feed + bottom tab bar + bottom sheet. */
:root{
  --bg:#07090d; --surface:#0f131a; --surface-2:#151a23; --surface-3:#1d2330; --line:rgba(255,255,255,.07); --line-2:rgba(255,255,255,.045);
  --fg:#f1f4f9; --muted:#97a1b1; --faint:#5d6778;
  --accent:#4f7dff; --accent-2:#7b9cff; --accent-soft:rgba(79,125,255,.15); --on-accent:#fff;
  --live:#ff3d5a; --live-soft:rgba(255,61,90,.14);
  --up:#2fd179; --down:#ff5a5a; --amber:#f6b73c;
  --z-ucl:#4f7dff; --z-uclq:#8fb0ff; --z-uel:#f08c2a; --z-uecl:#22c3a6; --z-relpo:#ff8a5c; --z-rel:#ff4d5e;
  --win:#2fd179; --draw:#8b95a6; --loss:#ff5a5a;
  --pitch:#16502d; --pitch-2:#145029; --pitch-line:rgba(255,255,255,.28);
  --skel:#161b25; --skel-hi:#212837;
  --glass:rgba(11,14,20,.78);
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --scrim:rgba(0,0,0,.55);
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-io:cubic-bezier(.77,0,.175,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --tabbar:0px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root{
  --bg:#eef1f6; --surface:#ffffff; --surface-2:#f5f7fa; --surface-3:#eaeef4; --line:rgba(12,20,36,.09); --line-2:rgba(12,20,36,.055);
  --fg:#0b1220; --muted:#566074; --faint:#97a0b0;
  --accent:#2b56f0; --accent-2:#2b56f0; --accent-soft:rgba(43,86,240,.1); --on-accent:#fff;
  --live:#e11d48; --live-soft:rgba(225,29,72,.09);
  --up:#15955a; --down:#dc2626; --amber:#c27803;
  --z-ucl:#2b56f0; --z-uclq:#7f9cf5; --z-uel:#e07a10; --z-uecl:#0f9d84; --z-relpo:#f0703c; --z-rel:#dc2626;
  --win:#15955a; --draw:#7d8797; --loss:#dc2626;
  --pitch:#2f8a4e; --pitch-2:#2b8048; --pitch-line:rgba(255,255,255,.55);
  --skel:#e7ebf1; --skel-hi:#f4f6f9;
  --glass:rgba(255,255,255,.82);
  --shadow:0 10px 40px rgba(15,23,42,.12);
  --scrim:rgba(10,14,22,.35);
  color-scheme:light;
}}
*{box-sizing:border-box}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;background:var(--bg)}
html,body{margin:0;color:var(--fg);background:var(--bg)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";padding-top:env(safe-area-inset-top,0px);min-height:100dvh}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation}
button,.chip,.tab,.seg button{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{font:inherit;font-size:16px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}

/* ---------- motion (cortas, ease-out; nada aparece desde cero) */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes flashbg{0%,30%{background:var(--live-soft)}100%{background:transparent}}
@keyframes tickUp{0%{background:color-mix(in srgb,var(--up) 28%,transparent)}100%{background:transparent}}
@keyframes tickDown{0%{background:color-mix(in srgb,var(--down) 28%,transparent)}100%{background:transparent}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes pulse{50%{opacity:.3}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.enter>*{animation:rise .28s var(--ease-out) both}
.enter>*:nth-child(2){animation-delay:30ms}.enter>*:nth-child(3){animation-delay:60ms}.enter>*:nth-child(4){animation-delay:90ms}.enter>*:nth-child(n+5){animation-delay:120ms}
.stagger .row{animation:rise .28s var(--ease-out) both;animation-delay:calc(min(var(--i,0),14) * 24ms)}
.pop{display:inline-block;animation:pop .45s var(--ease-out)}
.pulse{animation:pulse 1.6s ease-in-out infinite}
.skel{border-radius:8px;background:linear-gradient(90deg,var(--skel) 0 40%,var(--skel-hi) 50%,var(--skel) 60% 100%);background-size:300% 100%;animation:shimmer 1.3s linear infinite}
.press{transition:transform 140ms var(--ease-out),background-color 160ms ease,color 160ms ease,border-color 160ms ease}
.press:active{transform:scale(.97)}
.ind{position:absolute;left:0;bottom:-1px;height:2px;width:0;border-radius:2px;background:var(--accent);transition:transform .26s var(--ease-io),width .26s var(--ease-io)}
.seg .ind{top:3px;bottom:3px;height:auto;border-radius:9px;background:var(--surface-3);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:0}

/* ---------- cabecera */
.top{position:sticky;top:0;z-index:30;background:var(--glass);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid var(--line);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:10px;padding-left:var(--gut-l);padding-right:var(--gut-r);max-width:1600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;line-height:1}
.brand-mark{display:grid;place-items:center;height:28px;padding:0 7px;border-radius:7px;background:var(--accent);color:#fff;font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.02em;position:relative}
.brand-mark::after{content:"";position:absolute;right:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px var(--bg)}
.brand-word{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.14em;text-transform:uppercase}
.livepill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--live);padding:3px 9px;border-radius:99px;background:var(--live-soft)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--live);flex:none;display:inline-block}
.search{position:relative;flex:1;max-width:440px;margin-left:auto}
.search input{width:100%;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);padding:0 12px 0 36px;transition:border-color .2s ease,box-shadow .2s ease}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none}
.search>svg{position:absolute;left:11px;top:50%;translate:0 -50%;color:var(--faint);pointer-events:none}
.sres{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;max-height:60vh;overflow:auto;overscroll-behavior:contain;transform-origin:top center;animation:sresIn .18s var(--ease-out)}
@keyframes sresIn{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.sres .it{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px}
.sres .it .nm{flex:1;min-width:0;font-weight:700}
.sres .it .lg{font-size:12px;color:var(--muted);font-weight:500}
.sres .empty{padding:12px;color:var(--muted)}
.clock{font-size:12px;color:var(--muted);white-space:nowrap}
.hbtn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line);font-weight:700;white-space:nowrap;background:var(--surface-2)}
.hbtn .cnt{background:var(--accent);color:var(--on-accent);border-radius:99px;font-size:11px;padding:1px 7px}
.icobtn{display:none;width:38px;height:38px;border-radius:11px;place-items:center;background:var(--surface-2);border:1px solid var(--line)}

/* ---------- layout */
.layout{display:grid;grid-template-columns:244px minmax(0,1fr) minmax(0,440px);gap:18px;align-items:start;padding-block:18px 48px;padding-left:var(--gut-l);padding-right:var(--gut-r);max-width:1600px;margin:0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 96px);overflow:auto;scrollbar-width:none;overscroll-behavior:contain}
.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.detail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100dvh - 96px);overflow:auto;min-width:0;overscroll-behavior:contain;scrollbar-width:thin}
.scrim{display:none}
.seg{position:relative;display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:4px 8px;border-radius:9px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15;transition:color .18s ease}
.seg button[aria-pressed="true"]{color:var(--fg)}
.sblock{padding:10px}
.lbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:4px 6px 8px}
.slist{display:flex;flex-direction:column;gap:1px}
.sitem{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:10px;font-weight:600;min-width:0}
.sitem>.tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem[aria-current="true"]{background:var(--accent-soft);color:var(--accent-2)}
.sitem .meta{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap;font-weight:500}
.sitem .lv{margin-left:auto;font-size:11px;font-weight:800;color:var(--live);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.addfav{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;color:var(--accent-2);font-weight:700}
@media (hover:hover) and (pointer:fine){
  .sitem:hover,.dbtn:hover,.chip:hover,.row:hover,.mrow:hover,.sres .it:hover,.hbtn:hover,.arr:hover,.tb tbody tr:hover td{background:var(--surface-2)}
  .row:hover,.mrow:hover{background:var(--surface-2)}
  .addfav:hover{background:var(--accent-soft)}
  .lnk:hover,.tnm:hover,.tn:hover,.ga:hover{color:var(--accent-2)}
  .star:hover{border-color:var(--accent);color:var(--accent-2)}
  .pteam:hover,.lgcard:hover{border-color:var(--accent)}
}

/* logos */
.logo{--s:20px;flex:none;width:var(--s);height:var(--s);object-fit:contain}
.logo-fb{--s:20px;flex:none;display:inline-grid;place-items:center;width:var(--s);height:var(--s);border-radius:30%;background:var(--surface-3);color:var(--muted);font-weight:800;font-size:calc(var(--s)*.34)}
picture.lp{display:inline-flex;flex:none}

/* ---------- barra de fechas y filtros */
.toolbar{padding:10px;display:flex;flex-direction:column;gap:10px}
.dates{display:flex;align-items:center;gap:6px}
.arr{flex:none;width:34px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.dstrip{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;min-width:0}
.dbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;height:48px;border-radius:12px;line-height:1.05;min-width:0}
.dbtn .d1{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.dbtn .d2{font-family:var(--f-display);font-size:21px;font-weight:800}
.dbtn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.dbtn[aria-pressed="true"] .d1{color:inherit;opacity:.7}
.dbtn.today:not([aria-pressed="true"]) .d2{color:var(--accent-2)}
.dpick{flex:none;position:relative;width:34px;height:48px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.dpick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -2px;padding:0 2px}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:99px;border:1px solid var(--line);font-weight:700;font-size:13px;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip .n{font-size:11px;opacity:.75}
.chip.livechip[aria-pressed="false"] .n{color:var(--live);opacity:1}

/* ---------- partidos */
.group{overflow:hidden}
.gh{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-2)}
.gh .gt{font-weight:800;letter-spacing:-.01em}
.gh .gc{font-size:12px;color:var(--muted)}
.gh .ga{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.gh.favh .gt{color:var(--accent-2)}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) auto auto;align-items:center;gap:12px;width:100%;padding:10px 14px;border-bottom:1px solid var(--line-2);position:relative;transition:background-color .16s ease}
.row:last-child{border-bottom:0}
.row:active{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);transform:scaleY(.4);opacity:0;transition:transform .22s var(--ease-out),opacity .22s ease}
.row.sel::before{transform:none;opacity:1}
.rst{font-size:12px;font-weight:700;color:var(--muted);text-align:center;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px}
.rst.live,.rst.ht{color:var(--live)}
.rst.pst{color:var(--loss);font-size:11px}
.mbar{width:34px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--live);transition:width .6s var(--ease-out)}
.rteams{display:flex;flex-direction:column;gap:6px;min-width:0}
.rt{display:flex;align-items:center;gap:9px;min-width:0;font-weight:600}
.rt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt.lose{color:var(--muted)}
.rt.win{font-weight:800}
.rt .favstar{color:var(--amber);flex:none;display:inline-flex}
.rc{display:inline-block;width:8px;height:11px;border-radius:1.5px;background:var(--loss);flex:none}
.rsc{display:flex;flex-direction:column;gap:6px;align-items:flex-end;font-family:var(--f-display);font-size:21px;font-weight:800;line-height:20px;min-width:22px}
.rsc b{height:20px;font-weight:800}
.rsc.live b,.rsc.ht b{color:var(--live)}
.rsc .lose{color:var(--muted)}
.rsc small{font-size:11px;color:var(--muted);font-family:var(--f-body);font-weight:700}
.rodds{display:flex;gap:4px}
.rodds span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:44px;height:38px;border-radius:9px;background:var(--surface-2);font-weight:800;font-size:12.5px;line-height:1.1}
.rodds span small{font-size:9.5px;color:var(--faint);font-weight:700}
.rodds span.fav{color:var(--accent-2)}
.row.flash{animation:flashbg 2.4s ease-out}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty-state strong{color:var(--fg);font-size:16px}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-weight:800}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.favcta{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap;background:linear-gradient(120deg,var(--accent-soft),transparent 70%),var(--surface)}
.favcta p{margin:0;flex:1;min-width:200px;color:var(--muted)}
.favcta p strong{color:var(--fg);display:block;font-size:15px}
.note{font-size:12px;color:var(--faint);text-align:center;padding:4px 12px}
.skrow{display:grid;grid-template-columns:58px 1fr 24px;gap:12px;align-items:center;padding:14px}
.skrow .skel{height:12px}

/* ---------- ficha del partido */
.sheet-grab{display:none}
.dh{padding:16px 16px 12px;position:relative}
.dmeta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap;font-weight:600}
.dmeta .lnk{font-weight:800;color:var(--fg);display:inline-flex;align-items:center;gap:6px}
.xbtn{margin-left:auto;width:32px;height:32px;border-radius:10px;display:none;place-items:center;color:var(--muted);background:var(--surface-2)}
.dscore{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:8px;margin-top:16px}
.dteam{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.dteam .tlogo{display:grid;place-items:center;border-radius:16px;padding:4px}
.dteam .tn{font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.dteam .rec{font-size:11px;color:var(--muted)}
.dmid{text-align:center;padding-top:4px}
.big{font-family:var(--f-display);font-size:58px;font-weight:900;line-height:.9;letter-spacing:.01em;white-space:nowrap}
.big.pre{font-size:38px;color:var(--muted)}
.big.live{color:var(--live)}
.dst{margin-top:8px;font-size:12px;font-weight:800;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.dst.live,.dst.ht{color:var(--live)}
.star{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--muted);padding:4px 10px;border-radius:99px;border:1px solid var(--line)}
.star[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:#1a1200}
.star.popped svg{animation:pop .4s var(--ease-out)}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;font-size:12px;color:var(--muted)}
.scorers div:last-child{text-align:right}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;background:var(--surface)}
.tabs button{padding:12px 9px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap;transition:color .18s ease}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs .newb{font-size:9px;font-weight:800;color:var(--accent-2);vertical-align:super;margin-left:2px}
.dbody{padding:16px;display:flex;flex-direction:column;gap:18px}
.sec h4{margin:0 0 10px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);display:flex;justify-content:space-between;gap:8px;align-items:center}
.sec h4 span{text-transform:none;letter-spacing:0;font-weight:700}
.info{display:flex;flex-direction:column;gap:7px;font-size:13px}
.info div{display:flex;justify-content:space-between;gap:10px}
.info span:first-child{color:var(--muted)}
.info span:last-child{text-align:right}

/* incidencias */
.tl{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:1fr 52px 1fr;align-items:center;gap:6px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ev .m{text-align:center;font-weight:800;font-size:12px;color:var(--muted)}
.ev .s{display:flex;align-items:center;gap:8px;min-width:0}
.ev .s.r{flex-direction:row-reverse;text-align:right}
.ev .s .t{min-width:0}
.ev .s .t b{display:block;font-weight:700}
.ev .s .t small{color:var(--muted);font-size:11px}
.ev.goal .s .t b{font-weight:800}
.ev .in{color:var(--win)} .ev .out{color:var(--loss)}
.tsep{display:flex;justify-content:center;padding:9px 0}
.tsep span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--surface-2);padding:3px 11px;border-radius:99px}
.ico{flex:none}
.ico.y{display:inline-block;width:10px;height:13px;border-radius:2px;background:#f2c200}
.ico.rd{display:inline-block;width:10px;height:13px;border-radius:2px;background:var(--loss)}

/* barras de estadística */
.st{display:flex;flex-direction:column;gap:13px}
.srow .sl{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;gap:8px}
.srow .sl span{color:var(--muted);font-size:12px;text-align:center;font-weight:600}
.srow .sl b{font-weight:800}
.srow .bars{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.srow .bar{height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;display:flex}
.srow .bar:first-child{justify-content:flex-end}
.srow .bar i{display:block;height:100%;border-radius:3px;background:var(--faint);transform-origin:right;transition:width .55s var(--ease-out)}
.srow .bar:last-child i{transform-origin:left}
.srow .bar i.lead{background:var(--accent)}

/* probabilidades */
.prob{display:flex;height:34px;border-radius:10px;overflow:hidden;font-size:12px;font-weight:800;gap:2px}
.prob span{display:grid;place-items:center;min-width:0;overflow:hidden;white-space:nowrap;transition:width .55s var(--ease-out)}
.prob .p1{background:var(--accent);color:#fff}
.prob .px{background:var(--surface-3);color:var(--fg)}
.prob .p2{background:var(--fg);color:var(--bg)}
.probl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px;gap:6px;font-weight:600}

/* cuotas */
.odds3{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:8px}
.ocard{border:1px solid var(--line);border-radius:14px;padding:11px 12px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;background:var(--surface-2)}
.ocard .ol{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ocard .ov{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;display:flex;align-items:baseline;gap:6px}
.ocard .od{font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:2px;font-family:var(--f-body)}
.ocard .od.up{color:var(--up)} .ocard .od.down{color:var(--down)} .ocard .od.eq{color:var(--faint)}
.ocard .oo{font-size:11.5px;color:var(--muted);font-weight:600}
.ocard.tick-up{animation:tickUp 1.6s ease-out}.ocard.tick-down{animation:tickDown 1.6s ease-out}
.ocard.best{border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.ocard.best .ol{color:var(--accent-2)}
.omini{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 14px;align-items:center;font-size:13px}
.omini .h{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.omini b{font-weight:800}
.trk{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600;flex-wrap:wrap}
.trk .dot{background:var(--up)}
.legend2{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);font-weight:600}
.legend2 i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.disc{font-size:11.5px;color:var(--faint);line-height:1.5}

/* pronóstico */
.pick{border-radius:16px;padding:16px;background:radial-gradient(120% 140% at 0% 0%,var(--accent-soft),transparent 60%),var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pick .k{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-2)}
.pick .v{font-family:var(--f-display);font-size:34px;font-weight:900;line-height:1;letter-spacing:.005em}
.pick .s{color:var(--muted);font-size:13px}
.conf{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;color:var(--muted)}
.conf .m{flex:1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.conf .m i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .6s var(--ease-out)}
.pgrid2{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pstat{border:1px solid var(--line);border-radius:13px;padding:10px 12px}
.pstat .pv{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.pstat .pl2{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px}
.valbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent);padding:4px 10px;border-radius:99px}
.srcs{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted)}
.srcs div{display:flex;justify-content:space-between;gap:10px}
.srcs b{color:var(--fg);font-weight:700}

/* pronóstico: alternativas, fuentes y mercados */
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tier{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2);min-width:0}
.tier .tk{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tier.safe .tk{color:var(--up)} .tier.bal .tk{color:var(--accent-2)} .tier.risk .tk{color:var(--amber)}
.tier.safe{border-color:color-mix(in srgb,var(--up) 35%,transparent)}
.tier b{font-size:14px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.tier .tp{font-size:12.5px;font-weight:800}
.tier .sub{line-height:1.35}
.srcs2{display:flex;flex-direction:column;gap:10px}
.src2 .sh2{display:flex;align-items:baseline;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.src2 .sh2 b{font-weight:800}
.src2 .spick{margin-left:auto;font-size:12px;font-weight:800;color:var(--accent-2)}
.prob.prob-sm{height:22px;font-size:11px;border-radius:7px}
.mks{display:flex;flex-direction:column}
.mk{display:grid;grid-template-columns:minmax(0,1fr) 120px 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.mk:last-child{border-bottom:0}
.mkl{display:flex;flex-direction:column;min-width:0}
.mkl b{font-weight:700}
.mkp{display:flex;align-items:center;gap:8px}
.mkp b{width:38px;text-align:right;font-weight:800}
.mbar2{flex:1;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.mbar2 i{display:block;height:100%;background:var(--accent);border-radius:3px}
.mko{display:flex;align-items:center;justify-content:flex-end;gap:6px}
.mko b{font-weight:800}
.valtag{font-size:10px;font-weight:800;color:var(--up);background:color-mix(in srgb,var(--up) 14%,transparent);padding:2px 6px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em}
.insights{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.insights li{position:relative;padding-left:16px;font-size:13px;line-height:1.45}
.insights li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
@media (max-width:440px){.tiers{grid-template-columns:minmax(0,1fr)}.mk{grid-template-columns:minmax(0,1fr) 92px 74px}}

/* forma */
.form{display:inline-flex;gap:3px}
.fc{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:10px;font-weight:800;color:#fff}
.fc.W{background:var(--win)} .fc.D{background:var(--draw)} .fc.L{background:var(--loss)}
.kv{display:grid;grid-template-columns:1fr auto 1fr;gap:9px 10px;font-size:13px;align-items:center}
.kv .k{text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.kv .v2{text-align:right}

/* campo */
.pitch{position:relative;border-radius:16px;overflow:hidden;background:repeating-linear-gradient(180deg,var(--pitch) 0 9%,var(--pitch-2) 9% 18%);aspect-ratio:68/100;max-width:100%;display:flex;flex-direction:column}
.pitch::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--pitch-line);border-radius:4px;pointer-events:none}
.pitch::after{content:"";position:absolute;left:10px;right:10px;top:50%;border-top:1.5px solid var(--pitch-line);pointer-events:none}
.pitch .cc{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;translate:-50% -50%;border:1.5px solid var(--pitch-line);border-radius:50%;pointer-events:none}
.pitch .box{position:absolute;left:28%;right:28%;height:12%;border:1.5px solid var(--pitch-line);pointer-events:none}
.pitch .box.t{top:10px;border-top:0}
.pitch .box.b{bottom:10px;border-bottom:0}
.half{flex:1;display:flex;flex-direction:column;justify-content:space-around;padding:14px 6px;position:relative;z-index:1}
.line{display:flex;justify-content:space-around}
.pl{display:flex;flex-direction:column;align-items:center;gap:2px;width:66px;color:#fff;font-size:10.5px;text-align:center;line-height:1.1;animation:rise .3s var(--ease-out) both}
.pl .sh{position:relative;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;background:var(--c);color:var(--cf);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 10px rgba(0,0,0,.3)}
.pl .sh.ph{width:40px;height:40px;background:var(--c)}
.pl .sh.ph img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 15%;background:#dfe5ee;animation:fade .3s ease both}
.pl .sh .no2{position:absolute;right:-6px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;display:grid;place-items:center;font-size:9.5px;font-weight:800;background:var(--c);color:var(--cf);box-shadow:0 0 0 1.5px #fff}
.bench .bph,.bench .bph0{flex:none;width:26px;height:26px;border-radius:50%;object-fit:cover;object-position:50% 15%;background:var(--surface-3)}
.pl .sub8{position:absolute;right:-12px;top:-6px;font-size:9px;font-weight:800;padding:1px 3px;border-radius:4px;background:#fff;color:#c62828}
.pl .pn{text-shadow:0 1px 2px rgba(0,0,0,.6);font-weight:700;max-width:66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .ev2{display:flex;gap:2px;justify-content:center}
.luhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);gap:8px;font-weight:600}
.luhead b{color:var(--fg);font-family:var(--f-display);font-size:18px}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12.5px}
.bench .bp{display:flex;align-items:center;gap:6px;min-width:0;padding:3px 0}
.bench .bp .no{width:20px;color:var(--faint);font-weight:800;text-align:right;flex:none}
.bench .bp .nn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* gráficos */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .mid{stroke:var(--faint);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--f-body);font-weight:600}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;animation:draw .9s var(--ease-out) both}
.chart .ln.c2{stroke:var(--amber)} .chart .ln.c3{stroke:var(--fg);opacity:.75}
.chart .ar{fill:var(--accent);opacity:.12;animation:fade .6s .2s ease both}
.chart .ep{fill:var(--accent);stroke:var(--surface);stroke-width:2;animation:fade .25s .8s both}
.chart .ep.c2{fill:var(--amber)} .chart .ep.c3{fill:var(--fg)}
.chart .ept{fill:var(--accent-2);font-weight:800;font-size:12px;animation:fade .25s .8s both}
.chart.static .ln,.chart.static .ar,.chart.static .ep,.chart.static .ept{animation:none}
.gmap .gp{stroke:#fff;stroke-width:1.5}
.gmap .gp.h{fill:var(--accent)} .gmap .gp.a{fill:var(--amber)}
.gmap .pl2{fill:var(--pitch)} .gmap .pln{fill:none;stroke:var(--pitch-line);stroke-width:1.5}
.gmap circle.gp{animation:fade .3s var(--ease-out) both}

/* tablas */
.tw{overflow-x:auto;overscroll-behavior-x:contain}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-size:10.5px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;text-align:center;padding:9px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th.l,.tb td.l{text-align:left}
.tb th.sortable{cursor:pointer}
.tb th.sorted{color:var(--accent-2)}
.tb td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line-2);white-space:nowrap}
.tb tr.hl td{background:var(--accent-soft)}
.tb tr.fav .tnm{color:var(--amber)}
.tb td.pos{width:34px;position:relative;font-weight:800}
.tb td.pos::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--zc,transparent)}
.tb .tcell{display:flex;align-items:center;gap:9px;min-width:0}
.tb .tnm{font-weight:700;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.tb td.pts{font-weight:800}
.sub{font-size:11px;color:var(--muted);font-weight:500}
.lvpill{flex:none;display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--live-soft);color:var(--live)}
.lvpill.w{background:color-mix(in srgb,var(--up) 16%,transparent);color:var(--up)}
.lvpill.w .dot{background:var(--up)}
.lvpill.d{background:var(--surface-3);color:var(--muted)}
.lvpill.d .dot{background:var(--muted)}
.tb .mv{display:block;font-size:9px;font-weight:800;line-height:1}
.tb .mv.up{color:var(--up)} .tb .mv.dn{color:var(--down)}
.ltog{display:flex;flex-direction:column;gap:6px;padding:12px 14px 4px}
.ltog .seg{max-width:260px}
.ltog .seg .dot{width:6px;height:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:10px 14px;font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--zc)}

/* vistas */
.vhead{padding:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.vhead .vt{flex:1;min-width:0}
.vhead h1{font-family:var(--f-display);font-size:38px;font-weight:900;line-height:.95;letter-spacing:.005em;text-transform:uppercase}
.vhead .vs{font-size:13px;color:var(--muted);margin-top:4px;font-weight:600}
.vhead .lnk{font-weight:800}
.vtabs{position:relative;display:flex;gap:2px;padding:0 12px;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.vtabs button{padding:13px 10px;font-weight:700;color:var(--muted);white-space:nowrap;transition:color .18s ease}
.vtabs button[aria-selected="true"]{color:var(--fg)}
.vbody{padding:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile .tv{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1}
.tile .tl2{font-size:12px;color:var(--muted);margin-top:5px;font-weight:600}
.tile .tv small{font-size:18px;color:var(--muted);font-weight:700}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{padding:16px}
.card h3{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.card h3 span.k{text-transform:none;letter-spacing:0;font-weight:700}
.mlist{display:flex;flex-direction:column}
.mrow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line-2);font-size:13px;width:100%;border-radius:8px}
.mrow:last-child{border-bottom:0}
.mrow .md{font-size:11px;color:var(--muted);line-height:1.35;font-weight:600}
.mrow .vs2{display:flex;align-items:center;gap:7px;min-width:0;font-weight:600}
.mrow .vs2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .res{font-family:var(--f-display);font-weight:800;font-size:19px;display:flex;align-items:center;gap:8px;white-space:nowrap}
.mdnav{display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 12px}
.mdnav b{font-family:var(--f-display);font-size:22px;min-width:140px;text-align:center;font-weight:800}
.mdnav button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center}
.mdnav button:disabled{opacity:.35;cursor:default}
.ldcard ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column}
.ldcard li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid var(--line-2);min-width:0}
.ldcard li:last-child{border-bottom:0}
.ldcard .r{width:18px;color:var(--faint);font-weight:800;flex:none}
.ldcard .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ldcard .v{font-family:var(--f-display);font-weight:800;font-size:20px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pteam{display:flex;align-items:center;gap:10px;padding:11px;border-radius:14px;border:1px solid var(--line);position:relative;min-width:0;background:var(--surface-2)}
.pteam .nm{flex:1;min-width:0;font-weight:700;font-size:13px;line-height:1.2}
.pteam[aria-pressed="true"]{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--surface-2))}
.pteam .ck{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:background-color .18s ease,border-color .18s ease}
.pteam[aria-pressed="true"] .ck{background:var(--amber);border-color:var(--amber);color:#1a1200}
.pteam[aria-pressed="true"] .ck svg{animation:pop .35s var(--ease-out)}
.lggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lgcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);min-width:0}
.lgcard b{font-weight:800}
.lgcard .sub{margin-top:-6px}
.foot{font-size:12px;color:var(--faint);padding:8px 4px;line-height:1.5}
.err{padding:22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}

/* noticias */
.newsfeed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.art{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;text-decoration:none;min-width:0;transition:transform 140ms var(--ease-out),border-color .16s ease}
.art:active{transform:scale(.985)}
.art .im{position:relative;aspect-ratio:16/9;background:var(--surface-3);overflow:hidden}
.art .im img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s ease}
.art .im .vid{position:absolute;left:10px;bottom:10px;display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:99px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.art .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}

  .tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:700;color:var(--faint);transition:color .18s ease}

<script>
/* ================= utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fromKey=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=fromKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const DOW=['dom','lun','mar','mié','jue','vie','sáb'],MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fmtDay=k=>{const d=fromKey(k);return DOW[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const fmtDate=t=>{const d=new Date(t);return d.getDate()+' '+MON[d.getMonth()]+' '+String(d.getFullYear()).slice(2)};
const today=()=>dkey(Date.now());
const num=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n};
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const phone=()=>matchMedia('(max-width:819px)').matches;
const wide=()=>matchMedia('(min-width:1180px)').matches;
const ago=t=>{const s=Math.max(0,Math.round((Date.now()-t)/1000));return s<60?'hace '+s+' s':s<3600?'hace '+Math.round(s/60)+' min':'hace '+Math.round(s/3600)+' h'};

/* ================= competiciones ================= */
const LEAGUES=[
 {id:'esp.1',sp:'soccer',name:'LaLiga',country:'España',logo:15},
 {id:'eng.1',sp:'soccer',name:'Premier League',country:'Inglaterra',logo:23},
 {id:'ita.1',sp:'soccer',name:'Serie A',country:'Italia',logo:12},
 {id:'ger.1',sp:'soccer',name:'Bundesliga',country:'Alemania',logo:10},
 {id:'fra.1',sp:'soccer',name:'Ligue 1',country:'Francia',logo:9},
 {id:'uefa.champions',sp:'soccer',name:'Champions League',country:'Europa',logo:2,cup:true},
 {id:'uefa.europa',sp:'soccer',name:'Europa League',country:'Europa',logo:2310,cup:true},
 {id:'por.1',sp:'soccer',name:'Liga Portugal',country:'Portugal',logo:14},
 {id:'ned.1',sp:'soccer',name:'Eredivisie',country:'Países Bajos',logo:11},
 {id:'mex.1',sp:'soccer',name:'Liga MX',country:'México',logo:22},
 {id:'arg.1',sp:'soccer',name:'Liga Profesional',country:'Argentina',logo:1},
 {id:'bra.1',sp:'soccer',name:'Brasileirão',country:'Brasil',logo:85},
 {id:'usa.1',sp:'soccer',name:'MLS',country:'Estados Unidos',logo:19},
 {id:'nba',sp:'basketball',name:'NBA',country:'Estados Unidos'},
 {id:'atp',sp:'tennis',name:'ATP',country:'Circuito masculino'},
 {id:'wta',sp:'tennis',name:'WTA',country:'Circuito femenino'},
];
const LG=Object.fromEntries(LEAGUES.map(l=>[l.id,l]));
const SPORTS=[{id:'soccer',name:'Fútbol'},{id:'basketball',name:'Baloncesto'},{id:'tennis',name:'Tenis'}];
const API='https://site.api.espn.com/apis/site/v2/sports/';
const CORE='https://sports.core.api.espn.com/v2/sports/';
const ETF=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'});
// ESPN agrupa por día de la costa este de EE. UU.: pedimos los días de allí que cubren el día local
function etDays(day){const a=fromKey(day).getTime(),b=a+864e5-60000;return [...new Set([ETF.format(a),ETF.format(b)].map(s=>s.replace(/-/g,'')))]}
const URL={
  sbs:(lg,day)=>etDays(day).map(d=>`${API}${lg.sp}/${lg.id}/scoreboard?dates=${d}&limit=300`),
  sbDay:(lg,etDay)=>`${API}${lg.sp}/${lg.id}/scoreboard?dates=${etDay}&limit=300`,
  sb:lg=>`${API}${lg.sp}/${lg.id}/scoreboard`,
  sum:(lg,id)=>`${API}${lg.sp}/${lg.id}/summary?event=${id}`,
  odds:(lg,id)=>`${CORE}${lg.sp}/leagues/${lg.id}/events/${id}/competitions/${id}/odds`,
  pred:(lg,id)=>`${CORE}${lg.sp}/leagues/${lg.id}/events/${id}/competitions/${id}/predictor`,
  std:lg=>`https://site.api.espn.com/apis/v2/sports/${lg.sp}/${lg.id}/standings`,
  sched:(lg,id,fx)=>`${API}${lg.sp}/${lg.id}/teams/${id}/schedule${fx?'?fixture=true':''}`,
  roster:(lg,id)=>`${API}${lg.sp}/${lg.id}/teams/${id}/roster`,
  stats:lg=>`${API}${lg.sp}/${lg.id}/statistics`,
  nbaLeaders:()=>`https://site.api.espn.com/apis/site/v3/sports/basketball/nba/leaders`,
  news:(lg,team,n)=>`${API}${lg.sp}/${lg.id}/news?lang=es&region=us&limit=${n||20}${team?'&team='+team:''}`,
  newsAll:()=>`${API}soccer/all/news?lang=es&region=us&limit=40`,
};

/* ================= datos (caché, reintentos, re-render agrupado) ================= */
const C=new Map();let queued=false;
function load(url){
  let c=C.get(url);if(!c){c={};C.set(url,c)}
  if(c.p)return c.p;
  c.p=fetch(url).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
    .then(j=>{c.data=j;c.err=null;c.ok=Date.now()}).catch(e=>{c.err=e.message||'Error de red'})
    .finally(()=>{c.t=Date.now();c.p=null;queue()});
  return c.p;
}
function need(url,ttl=300000){const c=C.get(url);if(!c||(!c.p&&Date.now()-(c.t||0)>(c&&c.err&&!c.data?8000:ttl)))load(url);return C.get(url)}
const peek=url=>C.get(url)?.data;
// re-render agrupado; el setTimeout cubre los casos en que el navegador pausa requestAnimationFrame (pestaña en segundo plano)
function queue(){if(queued)return;queued=true;const run=()=>{if(!queued)return;queued=false;renderAll(false);if(!S.match)autoSelect()};requestAnimationFrame(run);setTimeout(run,120)}

/* ================= normalización ================= */
const TEAMS=new Map(),NE=new WeakMap();
function team(t,lg){
  if(!t)return{k:'?',id:'?',name:'Por definir',short:'',logo:'',lg:lg.id,sp:lg.sp};
  const k=lg.sp+':'+t.id;
  const o={k,id:t.id,name:t.displayName||t.name||t.shortDisplayName||'',short:t.abbreviation||t.shortDisplayName||'',logo:t.logo||t.logos?.[0]?.href||'',color:t.color,lg:lg.id,sp:lg.sp};
  const prev=TEAMS.get(k);
  if(!prev)TEAMS.set(k,o);
  else{if(!prev.logo&&o.logo)prev.logo=o.logo;if(!prev.color&&o.color)prev.color=o.color;if(LG[prev.lg]?.cup&&!lg.cup)prev.lg=lg.id}
  return TEAMS.get(k);
}
const per=p=>p<=4?p+'C':'PR'+(p>5?p-4:'');
function status(st,sp){
  const t=st?.type||{};const n=t.name||'';
  if(n==='STATUS_HALFTIME')return{s:'ht',label:'Descanso'};
  const PST={STATUS_POSTPONED:'Aplazado',STATUS_CANCELED:'Cancelado',STATUS_SUSPENDED:'Suspendido',STATUS_ABANDONED:'Abandonado',STATUS_DELAYED:'Retrasado',STATUS_FORFEIT:'No disputado'};
  if(PST[n])return{s:'pst',label:PST[n]};
  if(t.state==='pre')return{s:'pre'};
  if(t.state==='in'){
    if(sp==='soccer'){if(/EXTRA|OVERTIME/.test(n))return{s:'live',label:'Prór. '+(st.displayClock||'')};if(/SHOOTOUT|PENALT/.test(n))return{s:'live',label:'Penaltis'};return{s:'live',label:st.displayClock||'En juego',min:parseInt(st.displayClock)||0}}
    if(n==='STATUS_END_PERIOD')return{s:'live',label:'Fin '+per(st.period)};
    return{s:'live',label:per(st.period)+' '+(st.displayClock||''),bp:st.period};
  }
  if(sp==='soccer'){if(/PEN/.test(n))return{s:'ft',label:'Penaltis'};if(/AET|EXTRA/.test(n))return{s:'ft',label:'Final (pró.)'};return{s:'ft',label:'Final'}}
  return{s:'ft',label:(st.period||4)>4?'Final (PR)':'Final'};
}
function scoreVal(s){if(s==null)return null;if(typeof s==='object')return s.value!=null?s.value:num(s.displayValue);return num(s)}
const amer2dec=a=>{a=num(a);if(a==null||a===0)return null;return +(a>0?1+a/100:1+100/(-a)).toFixed(2)};
function norm(e,lg){
  if(NE.has(e))return NE.get(e);
  const c=e.competitions?.[0]||{};const cs=c.competitors||[];
  const H=cs.find(x=>x.homeAway==='home')||cs[0]||{},A=cs.find(x=>x.homeAway==='away')||cs[1]||{};
  const st=status(c.status||e.status,lg.sp);const det=c.details||[];
  const home=team(H.team,lg),away=team(A.team,lg);
  const live=st.s!=='pre'&&st.s!=='pst';
  const o=c.odds?.[0];const ml=o?.moneyline;
  const m={id:e.id,lg:lg.id,sp:lg.sp,ko:Date.parse(e.date||c.date),home,away,hs:live?scoreVal(H.score):null,as:live?scoreVal(A.score):null,
    st:st.s,label:st.label,min:st.min,pen:[H.shootoutScore,A.shootoutScore],rec:[H.records?.[0]?.summary,A.records?.[0]?.summary],
    red:[det.filter(d=>d.redCard&&d.team?.id===home.id).length,det.filter(d=>d.redCard&&d.team?.id===away.id).length],
    note:c.notes?.[0]?.headline||'',
    odds:ml?{h:amer2dec(ml.home?.close?.odds??ml.home?.open?.odds),a:amer2dec(ml.away?.close?.odds??ml.away?.open?.odds),d:amer2dec(o.drawOdds?.moneyLine),ho:amer2dec(ml.home?.open?.odds),ao:amer2dec(ml.away?.open?.odds)}:null};
  m.win=m.st==='ft'?(H.winner?'h':A.winner?'a':(m.hs>m.as?'h':m.hs<m.as?'a':'d')):null;
  NE.set(e,m);return m;
}
function dayMatches(sp,day){
  const out=[];let loading=0,err=0;
  for(const lg of LEAGUES.filter(l=>l.sp===sp)){
    const seen=new Set();let bad=false;
    for(const u of URL.sbs(lg,day)){
      const c=need(u,day===today()?25000:600000);
      if(!c.data){if(!bad){c.err?err++:loading++;bad=true}continue}
      for(const m of matchesOf(lg,c.data)){if(seen.has(m.id))continue;seen.add(m.id);if(dkey(m.ko)===day)out.push(m)}
    }
  }
  out.sort((a,b)=>a.ko-b.ko);return{out,loading,err};
}

}

    const st={};for(const x of e.stats||[])st[x.name]=x.value;const t=team(e.team,LG['arg.1']);

async function fetchPhoto(name,sp='soccer'){
  // el título del artículo debe contener todas las partes del nombre, para no mostrar la foto de otra persona
  const toks=normS(name).replace(/[^a-z0-9 ]/g,' ').split(' ').filter(w=>w.length>1);
  const ok=title=>{const t=' '+normS(title).replace(/[^a-z0-9 ]/g,' ')+' ';return toks.every(w=>t.includes(' '+w+' '))};
  const KW={soccer:['futbolista','footballer'],basketball:['baloncestista','basketball player'],tennis:['tenista','tennis player']}[sp]||['futbolista','footballer'];
  for(const [host,kw] of [['es',KW[0]],['en',KW[1]]]){
    const r=await fetch(`https://${host}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(name+' '+kw)}&gsrlimit=3&prop=pageimages|description&piprop=thumbnail&pithumbsize=160`).then(x=>x.json());
    const pages=Object.values(r?.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
    const p=pages.find(pg=>pg.thumbnail&&ok(pg.title)&&!/femenin|women|woman/i.test(pg.description||''));
    if(p)return p.thumbnail.source;
  }
  return '';
}

function seriesChart(vals,label,anim){
  if(vals.length<2)return'<p class="sub">Faltan partidos para dibujar la evolución.</p>';
  const W=560,H=200,pl=34,pr=36,pt=12,pb=26;const n=vals.length;const mn=Math.min(0,...vals),mx=Math.max(3,...vals);
  const step=Math.max(1,Math.ceil((mx-mn)/5));const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const x=i=>pl+(W-pl-pr)*(i/(n-1));const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo||1));
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  let g='';for(let v=lo;v<=hi;v+=step)g+=`<line class="${v===0?'mid':'grid'}" x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const ticks=[0,Math.floor((n-1)/2),n-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle">P${i+1}</text>`).join('');
  return `<div class="chart ${anim?'':'static'}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${g}${ticks}<path class="ar" d="${d} L${x(n-1)} ${y(Math.max(lo,0))} L${x(0)} ${y(Math.max(lo,0))} Z"/><path class="ln" pathLength="1" d="${d}"/><circle class="ep" cx="${x(n-1)}" cy="${y(vals[n-1])}" r="5"/><text class="ept" x="${x(n-1)+8}" y="${y(vals[n-1])+4}">${vals[n-1]}</text></svg></div>`;
}

function sanitizeWiki(html,skip=''){
  const doc=new DOMParser().parseFromString(html,'text/html');
  doc.querySelectorAll('sup,style,script,.mw-editsection,.reference,.noprint,.navbox,.mw-empty-elt,figure,.thumb,.hatnote,.metadata').forEach(n=>n.remove());
  const root=doc.querySelector('.mw-parser-output')||doc.body;let out='',lists=0;

  const txt=n=>n.textContent.replace(/\s+/g,' ').replace(/\[\d+\]/g,'').trim().replace(/^0?([123])\s*!\s*/,(_,d)=>MED[d]+' ');
  for(const n of root.children){
    if(/^H[2-5]$/.test(n.tagName)||n.classList.contains('mw-heading')){const t=txt(n);if(t&&!/^(palmar|t[ií]tulos)/i.test(t)&&normS(t)!==normS(skip))out+=`<h5>${esc(t)}</h5>`;continue}
    if(n.tagName==='UL'||n.tagName==='OL'){const items=[...n.querySelectorAll(':scope > li')].map(txt).filter(Boolean).slice(0,40);if(items.length){out+=`<ul class="wl">${items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`;lists++}continue}
    if(n.tagName==='TABLE'){
      // tablas de maquetación: se procesan las tablas de dentro y se omiten las leyendas
      const tbls=n.querySelector('table')?[...n.querySelectorAll('table')].filter(t=>!t.querySelector('table')):[n];
      for(const tb of tbls){if(/^s*(leyenda|t[ií]tulos por superficie|t[ií]tulos por)/i.test(txt(tb)))continue;
      const rows=[...tb.querySelectorAll(':scope > tbody > tr, :scope > thead > tr, :scope > tr')].slice(0,40).map(tr=>[...tr.children].map(td=>({h:td.tagName==='TH',t:txt(td),cs:+td.getAttribute('colspan')||1})));
      if(rows.length)out+=`<div class="tw"><table class="tb wt">${rows.map(r=>`<tr>${r.map(c=>`<${c.h?'th':'td'} ${c.cs>1?`colspan="${c.cs}"`:''} class="l">${esc(c.t)}</${c.h?'th':'td'}>`).join('')}</tr>`).join('')}</table></div>`;lists++}continue}
    if(n.tagName==='P'){const t=txt(n);if(t)out+=`<p class="wp">${esc(t)}</p>`}
  }
  return lists?out:'';
}

  if(a.displayHeight)tiles.push([toCm(a.displayHeight),'Altura']);
  if(myRank)tiles.push([myRank.points.toLocaleString('es-ES'),'Puntos de ranking']);
  else if(a.displayWeight)tiles.push([toKg(a.displayWeight),'Peso']);
  if(a.debutYear)tiles.push([a.debutYear,'Debut como profesional']);
  if(a.jersey&&tiles.length<4)tiles.push(['#'+esc(a.jersey),'Dorsal']);
  if(tiles.length)h+=`<div class="tiles ${anim?'enter':''}">${tiles.slice(0,4).map(([v,l])=>`<div class="tile"><div class="tv">${v}</div><div class="tl2">${l}</div></div>`).join('')}</div>`;
  // trayectoria
  if(sum?.data?.extract)h+=`<div class="panel card"><h3><span>Trayectoria</span><a class="lnk" href="${esc(sum.data.content_urls?.mobile?.page||'https://es.wikipedia.org/wiki/'+encodeURIComponent(title))}" target="_blank" rel="noopener" style="color:var(--accent-2);text-transform:none;letter-spacing:0;font-size:12px">Leer en Wikipedia ↗</a></h3><p class="wp" style="margin:0">${esc(sum.data.extract)}</p></div>`;
  else if(title===null||sum?.p)h+=`<div class="panel card">${skelBlock(100)}</div>`;
  // clubes / equipos
  const th=bio?.data?.teamHistory||[];
  if(th.length)h+=`<div class="panel card"><h3>${sp==='soccer'?'Clubes y selección':'Equipos'}</h3><div class="mlist">${th.map(t=>{const lgo=t.logo;const seas=String(t.seasons||'').split(', ');const span=seas.length>1?seas[0].split('-')[0]+'–'+seas[seas.length-1].split('-').pop():t.seasons;
    return `<div class="mrow" style="grid-template-columns:40px minmax(0,1fr) auto">${lgo?pic(rs(lgo.replace(CDN,''),80),null,28):'<span></span>'}<span class="vs2"><b>${esc(t.displayName)}</b></span><span class="sub">${esc(String(span).replace('CURRENT','actualidad'))}</span></div>`}).join('')}</div></div>`;
  // títulos y premios
  const aw=bio?.data?.awards||[];
  const secs=title?wikiSections(title):null;
  let tit='';
  if(aw.length)tit+=`<h5>Premios ${sp==='basketball'?'NBA':''}</h5><div class="awards">${aw.map(x=>`<span class="aw"><b>${esc(x.displayCount||'')}</b> ${esc(trAward(x.name))}<small>${esc((x.seasons||[]).join(', '))}</small></span>`).join('')}</div>`;
  if(secs)for(const s of secs){if(s.loading){tit+=skelBlock(80);continue}if(s.html)tit+=`<h5>${esc(s.line)}</h5>${s.html}`}
  if(tit)h+=`<div class="panel card wiki"><h3><span>Títulos y distinciones</span>${title?'<span class="k">Wikipedia · ESPN</span>':''}</h3>${tit}</div>`;
  else if(title===null||(secs===null&&title))h+=`<div class="panel card">${skelBlock(140)}</div>`;
  // estadísticas
  const cats=(stc?.data?.categories||[]).slice(0,2);
  for(const c of cats){const rows=(c.statistics||[]).slice().reverse().slice(0,12);if(!rows.length)continue;const labels=c.labels||[];
    h+=`<div class="panel"><div class="card" style="padding-bottom:0"><h3>${esc(trCat(c.displayName||c.name||'Estadísticas'))}</h3></div><div class="tw"><table class="tb"><thead><tr><th class="l">Temporada</th>${labels.map(l=>`<th>${esc(trLabel(l))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td class="l">${esc(r.season?.displayName||r.season?.year||'')}${r.teamSlug?` <span class="sub">${esc(r.teamSlug.split('.').pop().replace(/[-_]/g,' '))}</span>`:''}</td>${(r.stats||[]).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('')}${c.totals?`<tr><td class="l"><b>Total</b></td>${c.totals.map(v=>`<td class="pts">${esc(v)}</td>`).join('')}</tr>`:''}</tbody></table></div></div>`}
  // tenis: partidos de esta semana
  if(sp==='tennis'){const ms=[];for(const l of LEAGUES.filter(x=>x.sp==='tennis'))for(const u of URL.sbs(l,today()))for(const m of matchesOf(l,peek(u)))if(m.home.id===String(id)||m.away.id===String(id))ms.push(m);
    if(ms.length)h+=`<div class="panel group"><header class="gh"><span class="gt">Partidos de hoy</span></header>${ms.map((m,i)=>rowTennis(m,i)).join('')}</div>`}
  h+=`<p class="note">Datos de ESPN y biografía de Wikipedia en español.</p>`;
  return h;
}
const trPos=p=>({Forward:'Delantero',Midfielder:'Centrocampista',Defender:'Defensa',Goalkeeper:'Portero','Center':'Pívot','Guard':'Base/Escolta','Forward-Center':'Ala-pívot','Point Guard':'Base','Shooting Guard':'Escolta','Small Forward':'Alero','Power Forward':'Ala-pívot'})[p]||p;
const trCat=c=>c.replace('Regular Season Averages','Promedios por temporada (fase regular)').replace('Regular Season Totals','Totales por temporada (fase regular)').replace(/^offensive$/i,'Estadísticas por temporada');
const trLabel=l=>({STRT:'Tit.',FC:'Faltas',FA:'Recib.',YC:'Amar.',RC:'Rojas',G:'Goles',A:'Asist.',SHOT:'Tiros',SOG:'A puerta',OF:'F. juego',GP:'PJ',GS:'Tit.',MIN:'Min',REB:'Reb',AST:'Ast',BLK:'Tap',STL:'Rob',PF:'Faltas',TO:'Pérd.',PTS:'Pts',OR:'R.of',DR:'R.def',FG:'TC','FG%':'TC%','3PT':'T3','3P%':'T3%',FT:'TL','FT%':'TL%'})[l]||l;
const trAward=n=>n.replace('All-NBA','Quinteto ideal NBA').replace('1st Team','(1.º)').replace('2nd Team','(2.º)').replace('3rd Team','(3.º)').replace('Finals MVP','MVP de las Finales').replace(/^MVP$/,'MVP de la temporada').replace('All-Rookie','Quinteto de novatos').replace('Rookie of the Year','Novato del año').replace('Defensive Player of the Year','Mejor defensor del año').replace('All-Star','All-Star').replace('Western Conference Finals MVP','MVP de la final del Oeste').replace('Eastern Conference Finals MVP','MVP de la final del Este');
function toCm(h){const m=String(h).match(/(\d+)'\s*(\d+)/);return m?Math.round((+m[1]*12+ +m[2])*2.54)+' cm':esc(h)}
function toKg(w){const m=String(w).match(/(\d+)/);return m?Math.round(+m[1]*.4536)+' kg':esc(w)}

/* ================= orquestación ================= */
function afterRender(root,anim){
  if(anim)requestAnimationFrame(()=>requestAnimationFrame(()=>root.querySelectorAll('[data-w]').forEach((b,i)=>{b.style.transitionDelay=Math.min(i,20)*16+'ms';b.style.width=b.dataset.w+'%'})));
  root.querySelectorAll('[data-ind]').forEach(nav=>{
    const ind=nav.querySelector('.ind');const on=nav.querySelector('[aria-selected="true"],[aria-pressed="true"]');if(!ind||!on)return;
    const k=nav.dataset.ind;const to={x:on.offsetLeft,w:on.offsetWidth};const from=S.ind[k];
    const set=(p,tr)=>{ind.style.transition=tr?'':'none';ind.style.transform=`translateX(${p.x}px)`;ind.style.width=p.w+'px'};
    if(from&&(from.x!==to.x||from.w!==to.w)&&!reduceMotion()){set(from,false);ind.getBoundingClientRect();requestAnimationFrame(()=>set(to,true))}else set(to,false);
    S.ind[k]=to;
    if(anim&&nav.scrollWidth>nav.clientWidth)on.scrollIntoView({block:'nearest',inline:'nearest',behavior:reduceMotion()?'auto':'smooth'});
  });
}
function renderMain(anim){
  const v=S.view.type;const el=$('#main');
  if(!anim&&S.mainSkel)anim=true;
  if(v==='search'&&!anim&&document.activeElement?.id==='q2'){$('#sres2').innerHTML=searchResults($('#q2').value);return}
  el.innerHTML=v==='league'?viewLeague(anim):v==='team'?viewTeam(anim):v==='fav'?viewFav(anim):v==='leagues'?viewLeagues():v==='search'?viewSearch():v==='news'?viewNews(anim):v==='player'?viewPlayer(anim):viewMatches();
  S.mainSkel=!!el.querySelector('.skel');
  el.classList.toggle('stagger',!!anim&&v==='matches');
  if(anim&&v!=='matches'){el.classList.remove('enter');void el.offsetWidth;el.classList.add('enter')}else if(!anim)el.classList.remove('enter');
  afterRender(el,anim);
}
function renderAll(anim){if(!$('#sres').hidden)renderSearch();renderHead();renderSide();afterRender($('#side'),anim);renderTabbar();renderMain(anim);renderDetail(false)}
function autoSelect(){
  if(S.match||!wide())return;

  const pick=out.find(m=>isFavM(m)&&(m.st==='live'||m.st==='ht'))||out.find(m=>m.st==='live'||m.st==='ht')||out.find(isFavM)||out.find(m=>m.st==='pre')||out[out.length-1];
  S.match={id:pick.id,lg:pick.lg};renderDetail(true);renderMain(false);
}

    case 'league':{const lg=LG[id];if(lg.sp!==S.sport){S.sport=lg.sp;store.set('spi.sport',lg.sp)}go({type:'league',id,tab:'tb'});break}
    case 'ltab':S.view.tab=id;renderMain(true);break;
    case 'tblive':S.tbLive=id==='1';renderMain(false);renderDetail(false);break;
    case 'cal':S.view.ci=+id;renderMain(true);break;
    case 'lsort':S.view.sort=id;renderMain(false);break;
    case 'team':{const k=b.dataset.k;const t=TEAMS.get(k)||S.favs.get(k)||PLAYERS.get(k);if(!t)break;if(t.player){go({type:'player',id:t.id,sp:'tennis',lg:t.lg});break}if(t.sp!==S.sport){S.sport=t.sp;store.set('spi.sport',t.sp)}
      const lgId=b.dataset.lg&&!LG[b.dataset.lg].cup?b.dataset.lg:t.lg;$('#sres').hidden=true;$('#q').value='';go({type:'team',k,lg:lgId});break}
    case 'favview':go({type:'fav',lg:S.sport==='basketball'?'nba':(S.view.type==='league'?S.view.id:S.view.type==='team'?(S.view.lg||'esp.1'):'esp.1')});break;
    case 'flg':S.view.lg=id;renderMain(true);break;
    case 'fav':{const k=b.dataset.k;const t=TEAMS.get(k)||PLAYERS.get(k);if(S.favs.has(k))S.favs.delete(k);else if(t)S.favs.set(k,{k,name:t.name,short:t.short,logo:t.logo,lg:t.lg,sp:t.sp,id:t.id,...(t.player?{player:true,flag:t.flag}:{})});saveFavs();
      renderHead();renderSide();renderTabbar();renderMain(false);renderDetail(false);if(!$('#sres').hidden)renderSearch();
      document.querySelectorAll(`[data-act="fav"][data-k="${CSS.escape(k)}"]`).forEach(x=>x.classList.add('popped'));break}
    case 'nbell':{const k=b.dataset.k;const t=TEAMS.get(k)||S.favs.get(k)||S.notif[k];if(!t)break;
      if(S.view.type==='team'&&S.nOpen!==k&&S.notif[k]){S.nOpen=k;renderMain(false);break}
      if(!S.notif[k]){setTypes(k,NDEF[t.sp]);S.nOpen=k;renderMain(false);document.querySelectorAll(`[data-act="nbell"][data-k="${CSS.escape(k)}"]`).forEach(x=>x.classList.add('ring'));onNotifChange();toast('Avisos activados para '+t.name)}
      else{S.nOpen=S.nOpen===k?null:k;renderMain(false)}
      break}
    case 'ntype':{const k=b.dataset.k,ty=b.dataset.t;const cur=(S.notif[k]?.types||[]).slice();const i=cur.indexOf(ty);i>=0?cur.splice(i,1):cur.push(ty);setTypes(k,cur);renderMain(false);onNotifChange();break}
    case 'noff':{delete S.notif[b.dataset.k];saveNotif();renderMain(false);syncPush();break}
    case 'nenable':enablePush();break;
    case 'ntest':currentSub().then(sub=>sub?postPush('/test',{endpoint:sub.endpoint}):Promise.reject(new Error('dispositivo sin suscripción'))).then(r=>toast(r.ok?'Aviso de prueba enviado':'No se pudo enviar: '+(r.error||r.status))).catch(e=>toast('No se pudo enviar: '+e.message));break;
    case 'retry':{const u=b.dataset.u;if(u)C.delete(u);renderAll(false);break}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='dpick'&&e.target.value){S.dateT=Date.now();S.date=e.target.value;S.view={type:'matches'};if(wide())S.match=null;renderAll(true)}});

const normS=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
function searchResults(q){
  q=q.trim();if(!q)return `<p class="sub" style="padding:4px 2px">Busca un equipo o un jugador: futbolistas, tenistas o jugadores de la NBA.</p>`;
  const ph=playerHits(q);const pl=ph===null&&q.length>=3?`<div class="lbl" style="margin-top:14px">Jugadores</div><p class="sub">Buscando jugadores…</p>`:ph&&ph.length?`<div class="lbl" style="margin-top:14px">Jugadores</div><div class="phits">${ph.map(playerHitHtml).join('')}</div>`:'';
  const nq=normS(q);const hits=[...TEAMS.values()].filter(t=>t.id!=='?'&&(normS(t.name).includes(nq)||normS(t.short)===nq)).slice(0,12);
  const loading=LEAGUES.some(l=>C.get(URL.std(l))?.p);
  const tl=hits.length?`<div class="lbl">Equipos</div>`:'';
  return tl+(hits.length?hits.map(t=>`<div class="sres-it" style="display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid var(--line-2)">${logo(t,30)}<button class="press" style="flex:1;min-width:0;font-weight:700" data-act="team" data-k="${esc(t.k)}">${esc(t.name)}<br><span class="sub">${LG[t.lg]?.name||''}</span></button>${favBtn(t,false)}</div>`).join(''):(ph&&ph.length?'':`<div class="empty">${loading?'Buscando…':`Nada coincide con «${esc(q)}».`}</div>`))+pl;
}
function renderSearch(){
  const q=$('#q').value.trim();const box=$('#sres');if(!q){box.hidden=true;return}
  const nq=normS(q);const hits=[...TEAMS.values()].filter(t=>t.id!=='?'&&(normS(t.name).includes(nq)||normS(t.short)===nq)).slice(0,10);
  const loading=LEAGUES.some(l=>C.get(URL.std(l))?.p);
  const ph=playerHits(q);
  box.innerHTML=(hits.length?hits.map(t=>`<div class="it">${logo(t,26)}<button class="nm" data-act="team" data-k="${esc(t.k)}">${esc(t.name)}<br><span class="lg">${LG[t.lg]?.name||''}</span></button>${favBtn(t,false)}</div>`).join(''):'')+(ph&&ph.length?`<div class="lbl" style="margin:8px 8px 4px">Jugadores</div>${ph.slice(0,6).map(playerHitHtml).join('')}`:'')+(!hits.length&&!(ph&&ph.length)?`<div class="empty">${loading||ph===null&&q.length>=3?'Buscando…':`Nada coincide con «${esc(q)}».`}</div>`:'');
  box.hidden=false;
}

/* hoja inferior en el teléfono: arrastrar para cerrar (por distancia o por velocidad) */
(function(){
  const d=$('#detail');let y0=0,t0=0,dy=0,drag=false;
  d.addEventListener('pointerdown',e=>{
    if(!phone()||!d.classList.contains('open'))return;
    const onGrab=e.target.closest('.sheet-grab,.dh');if(!onGrab||e.target.closest('button'))return;
    if(d.scrollTop>4&&!e.target.closest('.sheet-grab'))return;
    drag=true;y0=e.clientY;t0=performance.now();dy=0;d.classList.add('dragging');d.setPointerCapture(e.pointerId);
  });
  d.addEventListener('pointermove',e=>{if(!drag)return;dy=e.clientY-y0;const v=dy<0?dy*.15:dy;d.style.setProperty('--drag',v+'px')});
  const end=()=>{if(!drag)return;drag=false;d.classList.remove('dragging');const vel=dy/Math.max(1,performance.now()-t0);
    if(dy>120||vel>.5)closeDetail();else d.style.setProperty('--drag','0px')};
  d.addEventListener('pointerup',end);d.addEventListener('pointercancel',end);
})();
